name: generate animation

on:
  # 24시간마다 자동 실행
  schedule:
    - cron: "0 */24 * * *" 
  
  # 수동 실행 허용
  workflow_dispatch:
  
  # master 브랜치에 push될 때 실행
  push:
    branches:
    - master

jobs:
  generate:
    permissions: 
      contents: write  # 128 에러 해결을 위한 핵심 권한!
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1단계: 애니메이션 생성 (최신 v3 사용)
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: phonyvif
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 2단계: output 브랜치로 푸시 (버전 업데이트 v4)
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4  # v3에서 v4로 업데이트하여 Node 버전 경고 해결
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # 별도 설정 필요 없는 기본 토큰
          # GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
